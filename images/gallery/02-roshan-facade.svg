    <path d="M6-20l8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10 8-10 8 10Z" fill="currentColor"/>
    <rect width="260" height="150" fill="currentColor"/>
    <g fill="url(#g2-lat)">
      <rect x="10" y="8" width="72" height="66"/><rect x="94" y="8" width="72" height="66"/><rect x="178" y="8" width="72" height="66"/>
    </g>
    <g fill="url(#g2-lou)">
      <rect x="10" y="84" width="72" height="30"/><rect x="94" y="84" width="72" height="30"/><rect x="178" y="84" width="72" height="30"/>
    </g>
    <g fill="#140B05" fill-opacity=".22">
      <rect x="12" y="122" width="68" height="20"/><rect x="96" y="122" width="68" height="20"/><rect x="180" y="122" width="68" height="20"/>
    </g>
    <g fill="currentColor"><path d="M46 125l8 7-8 7-8-7zM130 125l8 7-8 7-8-7zM214 125l8 7-8 7-8-7z"/></g>
    <g fill="#140B05" fill-opacity=".3">
      <rect x="84" width="6" height="150"/><rect x="168" width="6" height="150"/>
      <rect y="76" width="260" height="4"/><rect y="116" width="260" height="3"/>
    </g>
    <rect y="146" width="260" height="8" fill="currentColor"/>
    <rect y="150" width="260" height="4" fill="#140B05" fill-opacity=".3"/>
    <rect x="-8" y="-20" width="276" height="174" fill="url(#g2-roshade)"/>
    <rect x="-1" width="4" height="154" fill="#FFDDA6" opacity=".55"/>
  </g>
