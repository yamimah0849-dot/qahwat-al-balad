    <g fill="url(#g2-lou)"><rect x="9" y="84" width="60" height="30"/><rect x="81" y="84" width="60" height="30"/></g>
    <g fill="#140B05" fill-opacity=".22"><rect x="11" y="122" width="56" height="20"/><rect x="83" y="122" width="56" height="20"/></g>
    <g fill="currentColor"><path d="M39 125l8 7-8 7-8-7zM111 125l8 7-8 7-8-7z"/></g>
    <g fill="#140B05" fill-opacity=".3"><rect x="72" width="6" height="150"/><rect y="76" width="150" height="4"/><rect y="116" width="150" height="3"/></g>
    <rect y="146" width="150" height="8" fill="currentColor"/>
    <rect y="150" width="150" height="4" fill="#140B05" fill-opacity=".3"/>
    <rect x="-8" y="-20" width="166" height="174" fill="url(#g2-roshade)"/>
    <rect x="-1" width="4" height="154" fill="#FFDDA6" opacity=".55"/>
  </g>
  <!-- corbel under a roshan stack (width set by scale) -->
  <g id="g2-corbel">
    <path d="M0 0H100L92 12H8Z" fill="currentColor"/>
    <path d="M8 12H92L80 26H20Z" fill="currentColor"/>
    <path d="M20 26H80L64 44H36Z" fill="currentColor"/>
    <path d="M0 0H100L92 12H8ZM20 26H80L64 44H36Z" fill="#140B05" fill-opacity=".18"/>
  </g>
  <g id="g2-sh"><rect width="100" height="100" fill="#6E2A12"/></g>
