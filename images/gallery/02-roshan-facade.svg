<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="g2-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#AFC9C1"/>
    <stop offset=".16" stop-color="#D9CBA8"/>
    <stop offset=".32" stop-color="#F3C796"/>
    <stop offset=".55" stop-color="#F5AE78"/>
  </linearGradient>
  <linearGradient id="g2-wall" x1="0" y1="0" x2="1" y2=".35">
    <stop offset="0" stop-color="#F6CF98"/>
    <stop offset=".5" stop-color="#E9B67E"/>
    <stop offset="1" stop-color="#D49C68"/>
  </linearGradient>
  <linearGradient id="g2-wallR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E6B27A"/>
    <stop offset="1" stop-color="#D29E6A"/>
  </linearGradient>
  <linearGradient id="g2-wallL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C89C78"/>
    <stop offset="1" stop-color="#D6AC84"/>
  </linearGradient>
  <linearGradient id="g2-roshade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFE6BE" stop-opacity=".35"/>
    <stop offset=".35" stop-color="#FFE6BE" stop-opacity="0"/>
    <stop offset="1" stop-color="#1A0E06" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="g2-ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9A6E5C"/>
    <stop offset="1" stop-color="#6E4A3C"/>
  </linearGradient>
  <linearGradient id="g2-glowtop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE3B0" stop-opacity=".45"/>
    <stop offset="1" stop-color="#FFE3B0" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="g2-sun" cx="0" cy=".3" r=".8">
    <stop offset="0" stop-color="#FFE6B8" stop-opacity=".85"/>
    <stop offset="1" stop-color="#FFE2B0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2-vig" cx=".5" cy=".46" r=".75">
    <stop offset=".55" stop-color="#2A1D14" stop-opacity="0"/>
    <stop offset="1" stop-color="#2A1D14" stop-opacity=".34"/>
  </radialGradient>
  <pattern id="g2-stone" width="240" height="120" patternUnits="userSpaceOnUse" patternTransform="scale(.72)">
    <g fill="#FFF2DA" fill-opacity=".1"><rect x="110" width="65" height="22"/><rect x="55" y="48" width="65" height="20"/><rect x="165" y="68" width="60" height="28"/></g>
    <g fill="#7A4A26" fill-opacity=".05"><rect x="150" y="22" width="60" height="26"/><rect y="96" width="70" height="24"/><rect x="30" y="68" width="65" height="28"/></g>
    <path d="M0 21.5H240M0 47.5H240M0 67.5H240M0 95.5H240M0 119.5H240M40 0V22M110 0V22M175 0V22M15 22V48M80 22V48M150 22V48M210 22V48M55 48V68M120 48V68M190 48V68M30 68V96M95 68V96M165 68V96M225 68V96M70 96V120M135 96V120M200 96V120" fill="none" stroke="#8E5E38" stroke-opacity=".15" stroke-width="1.2"/>
  </pattern>
  <pattern id="g2-lat" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M4.5 1.2L7.8 4.5 4.5 7.8 1.2 4.5Z" fill="#140B05" fill-opacity=".72"/>
  </pattern>
  <pattern id="g2-lou" width="10" height="7" patternUnits="userSpaceOnUse">
    <rect y="4.6" width="10" height="2.4" fill="#140B05" fill-opacity=".5"/>
